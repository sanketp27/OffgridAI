[project]
name = "offgrid-ai-backend"
version = "0.1.0"
description = "OffGrid AI — platform-agnostic retail intelligence backend (FastAPI + Google ADK + Vertex AI)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # API layer
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",       # required for multipart/form-data endpoints

    # Agent orchestration
    "google-adk>=0.1.0",             # Google Agent Development Kit

    # Gemini (chat + embeddings), Vertex AI mode or Gemini Developer API
    # mode — see services/_genai_client_factory.py. This replaced
    # `vertexai.generative_models` / `vertexai.language_models`, which
    # Google deprecated 2025-06-24 and is removing.
    "google-genai>=1.15",

    # Google Cloud SDKs
    # `>=2.19` because `find_nearest(..., distance_result_field=...)` and
    # the `filter=FieldFilter(...)` keyword form of `.where()` are used
    # throughout services/firestore.py.
    "google-cloud-firestore>=2.19.0",
    # No longer used for generative calls (see google-genai above); kept
    # for google-adk's own transitive needs and as the SDK the optional
    # Vertex AI Vector Search stretch backend would use.
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-storage>=2.17.0",
    "google-cloud-bigquery>=3.25.0",
    "firebase-admin>=6.5.0",
    "google-cloud-secret-manager>=2.20.0",

    # Core libraries
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real Firestore/GCP resources (excluded by default)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
